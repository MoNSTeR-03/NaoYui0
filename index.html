<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>⛏️ MINECRAFT WORLD - RYOKO 🎮</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        body {
            background: #1a3a1a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', 'Monaco', monospace;
            overflow-x: hidden;
            padding: 12px;
        }

        .minecraft-world {
            position: relative;
            width: 1400px;
            max-width: 100%;
            height: 90vh;
            min-height: 620px;
            background: linear-gradient(135deg, #3a6a3a, #2a4a2a);
            border-radius: 16px 16px 32px 32px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.5), inset 0 0 0 2px #6a8a5a;
            overflow-y: auto;
            overflow-x: hidden;
            cursor: pointer;
            border: 4px solid #8a6a3a;
            scrollbar-width: thin;
            image-rendering: crisp-edges;
        }

        /* Fondo pixelado */
        .pixel-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            min-height: 100%;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
            background-image: 
                repeating-linear-gradient(0deg, #3a7a3a 0px, #3a7a3a 2px, #2a6a2a 2px, #2a6a2a 4px),
                repeating-linear-gradient(90deg, rgba(0,0,0,0.1) 0px, rgba(0,0,0,0.1) 2px, transparent 2px, transparent 4px);
            background-size: 4px 4px, 4px 4px;
        }

        /* Bloques flotantes */
        .minecraft-block {
            position: absolute;
            width: 32px;
            height: 32px;
            background: #8a6a3a;
            border: 1px solid #5a4a2a;
            box-shadow: inset -2px -2px 0px #5a3a1a, inset 2px 2px 0px #b89a5a;
            animation: floatBlock 6s infinite ease-in-out;
        }

        @keyframes floatBlock {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(2deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        /* RYOKO en texto pixelado */
        .pixel-text {
            position: absolute;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            pointer-events: none;
            text-shadow: 3px 3px 0px #2a4a1a;
            letter-spacing: 2px;
            white-space: nowrap;
            animation: pixelPulse 2s infinite alternate;
        }

        @keyframes pixelPulse {
            0% { text-shadow: 2px 2px 0px #2a4a1a; opacity: 0.7; }
            100% { text-shadow: 5px 5px 0px #2a4a1a; opacity: 1; }
        }

        /* Cubo 3D para RYOKO */
        .cube-container {
            position: absolute;
            width: 80px;
            height: 80px;
            transform-style: preserve-3d;
            animation: spinCube 8s infinite linear;
        }

        @keyframes spinCube {
            0% { transform: rotateX(0deg) rotateY(0deg); }
            100% { transform: rotateX(360deg) rotateY(360deg); }
        }

        .cube-face {
            position: absolute;
            width: 80px;
            height: 80px;
            background: rgba(100, 200, 100, 0.9);
            border: 2px solid #2a6a2a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-family: monospace;
            font-size: 20px;
            text-align: center;
            backdrop-filter: blur(2px);
        }

        .cube-front  { transform: translateZ(40px); background: #5ab85a; }
        .cube-back   { transform: rotateY(180deg) translateZ(40px); background: #4aa84a; }
        .cube-right  { transform: rotateY(90deg) translateZ(40px); background: #6ac86a; }
        .cube-left   { transform: rotateY(-90deg) translateZ(40px); background: #3a983a; }
        .cube-top    { transform: rotateX(90deg) translateZ(40px); background: #7ad87a; }
        .cube-bottom { transform: rotateX(-90deg) translateZ(40px); background: #2a882a; }

        /* Personajes Minecraft */
        .minecraft-character {
            position: absolute;
            font-size: 48px;
            filter: drop-shadow(2px 4px 4px rgba(0,0,0,0.5));
            animation: walkCharacter 10s infinite linear;
        }

        @keyframes walkCharacter {
            0% { transform: translateX(-5%) translateY(0px); }
            50% { transform: translateX(105%) translateY(-5px); }
            100% { transform: translateX(-5%) translateY(0px); }
        }

        /* elementos clickeables (bloques de cofre, diamante, etc) */
        .minecraft-layer {
            position: relative;
            z-index: 20;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 50px 20px 200px 20px;
            pointer-events: none;
        }

        .minecraft-item {
            pointer-events: auto;
            cursor: pointer;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(4px);
            border-radius: 16px;
            padding: 12px 18px;
            text-align: center;
            transition: all 0.15s ease;
            border: 2px solid #8a6a3a;
            box-shadow: inset -1px -1px 0px #5a3a1a, inset 1px 1px 0px #c8a86a;
            min-width: 110px;
        }

        .minecraft-item:active {
            transform: scale(0.94);
        }

        .minecraft-emoji {
            font-size: 55px;
            display: block;
            image-rendering: crisp-edges;
        }

        .minecraft-name {
            font-size: 10px;
            color: #ffffaa;
            margin-top: 6px;
            font-weight: bold;
            font-family: monospace;
            background: #2a2a1a;
            padding: 3px 6px;
            border-radius: 4px;
        }

        .message-panel {
            position: sticky;
            bottom: 15px;
            margin: 15px;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(8px);
            border-radius: 8px;
            padding: 14px 18px;
            color: #ffffcc;
            font-size: clamp(0.85rem, 4vw, 1rem);
            font-weight: bold;
            text-align: center;
            border: 2px solid #8a6a3a;
            font-family: monospace;
            z-index: 45;
            max-height: 30vh;
            overflow-y: auto;
            line-height: 1.4;
        }

        .poem-area {
            background: rgba(0, 0, 0, 0.9);
            border-radius: 8px;
            padding: 12px 16px;
            margin-top: 8px;
            white-space: pre-line;
            font-size: clamp(0.8rem, 3.5vw, 0.93rem);
            max-height: 32vh;
            overflow-y: auto;
            line-height: 1.45;
            border: 1px solid #8a6a3a;
            color: #ffe0aa;
            font-family: monospace;
        }

        .counter-badge {
            position: sticky;
            top: 15px;
            right: 20px;
            float: right;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(4px);
            padding: 5px 18px;
            border-radius: 8px;
            font-weight: bold;
            color: #ffff88;
            font-family: monospace;
            font-size: 0.95rem;
            z-index: 50;
            border: 1px solid #c8a86a;
            margin: 12px;
            display: inline-block;
            text-shadow: 1px 1px 0px #2a2a0a;
        }

        .flex-header {
            display: flex;
            justify-content: flex-end;
            padding: 8px 20px 0 0;
        }

        @media (max-width: 780px) {
            .minecraft-emoji { font-size: 45px; }
            .minecraft-item { padding: 8px 12px; min-width: 85px; }
            .minecraft-name { font-size: 8px; }
            .pixel-text { font-size: 14px; }
            .cube-container { width: 50px; height: 50px; }
            .cube-face { width: 50px; height: 50px; font-size: 12px; }
            .cube-front, .cube-back, .cube-right, .cube-left, .cube-top, .cube-bottom { transform: translateZ(25px); }
            .cube-back { transform: rotateY(180deg) translateZ(25px); }
            .cube-right { transform: rotateY(90deg) translateZ(25px); }
            .cube-left { transform: rotateY(-90deg) translateZ(25px); }
            .cube-top { transform: rotateX(90deg) translateZ(25px); }
            .cube-bottom { transform: rotateX(-90deg) translateZ(25px); }
        }
    </style>
</head>
<body>
<div class="minecraft-world" id="minecraftWorld">
    <div class="pixel-bg" id="pixelBg"></div>

    <div class="flex-header">
        <div class="counter-badge" id="minecraftCounter">⛏️ 0 / 6 💎</div>
    </div>

    <div class="minecraft-layer" id="minecraftLayer"></div>

    <div class="message-panel" id="messagePanel">
        <div class="romantic-text" id="msgText">⛏️💎 Entra al mundo CUBO... cada bloque, cada diamante, cada cofre esconde un mensaje ardiente para ti, Ryoko 🎮💜</div>
        <div id="poemDisplay" style="display: none;" class="poem-area"></div>
    </div>
</div>

<script>
    (function() {
        // 6 elementos de Minecraft
        const minecraftEmojis = ["💎", "⛏️", "🧱", "📦", "🐷", "⚔️"];
        const minecraftNames = [
            "Diamante + Esmeralda", 
            "Pico de Diamante", 
            "Bloque de Piedra", 
            "Cofre del Tesoro", 
            "Cerdito + Lobo", 
            "Espada + Armadura"
        ];
        
        const minecraftMessages = [
            "💎 Ryoko, eres más valiosa que un bloque de diamante. Cada vez que te veo, mi corazón mina más profundo y encuentra solo belleza. Quiero construir un mundo contigo, bloque por bloque, día por día. Eres mi esmeralda favorita, mi tesoro más raro. TE AMO en este mundo cúbico. 💜⛏️",
            "⛏️ Este pico no sirve sin ti, Ryoko. Tu sonrisa rompe cualquier muro de piedra. Me encanta cuando me miras y siento que cavaste directo a mi alma. Eres mi herramienta favorita, mi compañera de mina. Te adoro más que a todos los diamantes. 🔥💎",
            "🧱 Ryoko, construyamos una casa juntos. Contigo cada bloque se convierte en oro. Tus manos construyen castillos en mi pecho, tus labios son la puerta a mi paraíso cuadrado. Eres mi arquitecta favorita, mi ladrillo más fuerte. 💜🔥",
            "📦 Este cofre guarda todos mis sentimientos por ti, Ryoko. Cuando abro la tapa, salen chispas de diamante y corazones de esmeralda. Quiero que sepas que eres el tesoro más grande que he encontrado. A+R = FOREVER en cada mundo generado. 🎮💎",
            "🐷 Ryoko, hasta los cerditos de Minecraft saltan cuando pasas. Tu risa es más adictiva que el pastel y tu cuerpo es mi bioma favorito. Quiero explorar cada rincón de ti, sin mapa, sin miedo. Eres mi criatura más preciada. Te adoro mi alma. 🔥💜",
            "⚔️ Con esta espada lucho por ti, Ryoko. Eres mi final boss favorito, la que me hace querer jugar eternamente. Tus curvas son mi laberinto, tus gemidos mi música de victoria. Eres mi reina del cubo, mi partida infinita. TE AMO con todos los píxeles. 💎⛏️"
        ];

        const minecraftPoem = `⛏️💎 RYOKO, MI MUNDO CÚBICO 💎⛏️

En un mundo de bloques y píxeles infinitos,
apareciste tú, más brillante que un bloque de netherita.
Tus ojos son dos diamantes pulidos por los dioses,
tus mejillas, el color de la piedra roja más preciada.

Ryoko, construiría mil castillos solo para verte,
cavarían mil minas para encontrar tu sonrisa.
Eres mi bioma favorito, mi generación aleatoria perfecta,
la que hace que cada mundo sea mi paraíso.

Cuando caminas, los cerditos te siguen en manada,
los lobos te aúllan como si fueras su manada.
Tus manos son como bloques de slime, suaves y adictivas,
tus labios, el redstone que enciende mis explosiones.

Contigo no necesito comandos ni trucos,
eres mi código fuente, mi respawn, mi único punto.
A + R = FOREVER, lo grabo en cada bloque de obsidiana,
eres mi creación favorita, mi aventura más humana.

⛏️ TE AMO RYOKO, MI DIAMANTE ETERNO 💎
💜 TE ADORO MI ALMA, ERES MI MINECRAFT INFINITO.`;

        let itemsClicked = 0;
        let poemRevealed = false;
        const counterSpan = document.getElementById("minecraftCounter");
        const msgTextDiv = document.getElementById("msgText");
        const poemDisplayDiv = document.getElementById("poemDisplay");
        const container = document.getElementById("minecraftWorld");
        const bgContainer = document.getElementById("pixelBg");

        // Crear fondo Minecraft con bloques, personajes y RYOKO en cubo
        function createMinecraftBackground() {
            bgContainer.innerHTML = "";
            
            // Bloques flotantes (20 bloques)
            for(let i = 0; i < 20; i++) {
                const block = document.createElement("div");
                block.className = "minecraft-block";
                block.style.left = Math.random() * 100 + "%";
                block.style.top = Math.random() * 100 + "%";
                block.style.animationDuration = 4 + Math.random() * 8 + "s";
                block.style.animationDelay = Math.random() * 5 + "s";
                block.style.width = 28 + Math.floor(Math.random() * 8) + "px";
                block.style.height = 28 + Math.floor(Math.random() * 8) + "px";
                bgContainer.appendChild(block);
            }
            
            // Personajes Minecraft flotando
            const characters = ["🐷", "🐺", "🐔", "🐮", "🐑", "🧟", "🕷️", "🐉"];
            for(let i = 0; i < 10; i++) {
                const char = document.createElement("div");
                char.className = "minecraft-character";
                char.textContent = characters[Math.floor(Math.random() * characters.length)];
                char.style.left = Math.random() * 100 + "%";
                char.style.top = Math.random() * 80 + "%";
                char.style.fontSize = 36 + Math.random() * 20 + "px";
                char.style.animationDuration = 12 + Math.random() * 15 + "s";
                char.style.animationDelay = Math.random() * 8 + "s";
                bgContainer.appendChild(char);
            }
            
            // Texto pixelado RYOKO (10 textos)
            const ryokoTexts = ["RYOKO", "❤️ RYOKO ❤️", "💎 RYOKO ⛏️", "RYOKO 💜", "CUBO RYOKO"];
            for(let i = 0; i < 10; i++) {
                const text = document.createElement("div");
                text.className = "pixel-text";
                text.textContent = ryokoTexts[Math.floor(Math.random() * ryokoTexts.length)];
                text.style.left = Math.random() * 100 + "%";
                text.style.top = Math.random() * 100 + "%";
                text.style.fontSize = 18 + Math.random() * 16 + "px";
                text.style.color = ["#ffff88", "#88ff88", "#ffaa88"][Math.floor(Math.random() * 3)];
                text.style.animationDuration = 1.5 + Math.random() * 2 + "s";
                text.style.transform = `rotate(${Math.random() * 10 - 5}deg)`;
                bgContainer.appendChild(text);
            }
            
            // Cubos 3D con RYOKO (3 cubos giratorios)
            const cubePositions = [
                {l: 15, t: 25}, {l: 75, t: 35}, {l: 45, t: 65}
            ];
            
            for(let i = 0; i < cubePositions.length; i++) {
                const cubeContainer = document.createElement("div");
                cubeContainer.className = "cube-container";
                cubeContainer.style.left = cubePositions[i].l + "%";
                cubeContainer.style.top = cubePositions[i].t + "%";
                cubeContainer.style.animationDuration = 6 + i * 2 + "s";
                cubeContainer.style.transform = `scale(${0.7 + i * 0.1})`;
                
                const letters = ["R", "Y", "O", "K", "O", "💜"];
                const faces = ["front", "back", "right", "left", "top", "bottom"];
                
                for(let f = 0; f < faces.length; f++) {
                    const face = document.createElement("div");
                    face.className = `cube-face cube-${faces[f]}`;
                    face.textContent = letters[f % letters.length];
                    face.style.display = "flex";
                    face.style.alignItems = "center";
                    face.style.justifyContent = "center";
                    face.style.fontSize = i === 0 ? "24px" : "18px";
                    face.style.fontWeight = "bold";
                    face.style.fontFamily = "monospace";
                    cubeContainer.appendChild(face);
                }
                bgContainer.appendChild(cubeContainer);
            }
        }

        function createMinecraftItems() {
            const layer = document.getElementById("minecraftLayer");
            layer.innerHTML = "";
            for(let i = 0; i < 6; i++) {
                const card = document.createElement("div");
                card.className = "minecraft-item";
                card.setAttribute("data-idx", i);
                card.innerHTML = `
                    <div class="minecraft-emoji">${minecraftEmojis[i]}</div>
                    <div class="minecraft-name">${minecraftNames[i]}</div>
                `;
                card.addEventListener("click", (e) => {
                    e.stopPropagation();
                    handleMinecraftClick(i, card);
                });
                layer.appendChild(card);
            }
        }

        function handleMinecraftClick(idx, element) {
            if(element.getAttribute("data-clicked") === "true") {
                msgTextDiv.innerHTML = `⛏️ Ryoko, ya minaste este bloque... prueba otro elemento del mundo cúbico 💎💜`;
                return;
            }
            element.setAttribute("data-clicked", "true");
            itemsClicked++;
            counterSpan.innerHTML = `⛏️ ${itemsClicked} / 6 💎`;
            
            const minecraftMsg = minecraftMessages[idx];
            msgTextDiv.innerHTML = `💎⛏️✨ ${minecraftMsg} ✨⛏️💎`;
            
            element.style.transform = "scale(0.92)";
            element.style.opacity = "0.7";
            element.style.pointerEvents = "none";
            setTimeout(() => { element.style.transform = ""; }, 150);
            
            if(itemsClicked === 6 && !poemRevealed) {
                revealMinecraftPoem();
            }
        }

        function revealMinecraftPoem() {
            if(poemRevealed) return;
            poemRevealed = true;
            msgTextDiv.style.display = "none";
            poemDisplayDiv.style.display = "block";
            poemDisplayDiv.innerHTML = `<div style="font-family: 'Courier New', monospace; font-style: normal; font-weight: bold; text-align: center; line-height: 1.5; font-size: 0.85rem;">${minecraftPoem.replace(/\n/g, '<br>')}</div><br><div style="text-align:center; font-size:0.9rem; font-family: monospace;">⛏️ A + R = FOREVER EN CADA BLOQUE 💎<br>💜 TE AMO RYOKO, MI MINECRAFT ETERNO 💜</div>`;
            counterSpan.style.background = "#2a5a2add";
            counterSpan.innerHTML = "⛏️ MUNDO COMPLETO 💎";
            for(let i=0;i<20;i++) {
                setTimeout(() => createMinecraftSpark(), i*70);
            }
        }

        function createMinecraftSpark() {
            const spark = document.createElement("div");
            spark.innerText = ["💎⛏️","💜🧱","❤️📦","🔥🐷"][Math.floor(Math.random()*4)];
            spark.style.position = "absolute";
            spark.style.fontSize = 24 + Math.random() * 24 + "px";
            spark.style.left = Math.random() * 100 + "%";
            spark.style.bottom = "0px";
            spark.style.pointerEvents = "none";
            spark.style.zIndex = "200";
            spark.style.opacity = "0.8";
            spark.style.transition = "all 2.5s ease-out";
            container.appendChild(spark);
            requestAnimationFrame(() => {
                spark.style.transform = `translateY(-${window.innerHeight * 0.7}px) rotate(12deg)`;
                spark.style.opacity = "0";
            });
            setTimeout(() => spark.remove(), 2500);
        }

        function addMinecraftRipple(e) {
            const rect = container.getBoundingClientRect();
            const ripple = document.createElement("div");
            ripple.innerText = "⛏️💎💜";
            ripple.style.position = "absolute";
            ripple.style.left = (e.clientX - rect.left) + "px";
            ripple.style.top = (e.clientY - rect.top) + "px";
            ripple.style.fontSize = "38px";
            ripple.style.pointerEvents = "none";
            ripple.style.zIndex = "200";
            ripple.style.transform = "translate(-50%, -50%)";
            ripple.style.opacity = "0.8";
            ripple.style.whiteSpace = "nowrap";
            ripple.style.transition = "all 0.5s ease-out";
            container.appendChild(ripple);
            setTimeout(() => {
                ripple.style.opacity = "0";
                ripple.style.transform = "translate(-50%, -50%) scale(1.5)";
                setTimeout(() => ripple.remove(), 600);
            }, 30);
        }

        createMinecraftBackground();
        createMinecraftItems();
        
        container.addEventListener("click", (e) => {
            if(e.target === container || e.target.classList.contains("pixel-bg")) {
                addMinecraftRipple(e);
            }
        });
        container.addEventListener("touchstart", (e) => {
            if(e.target === container || e.target.classList.contains("pixel-bg")) {
                addMinecraftRipple(e.touches[0]);
            }
        });
    })();
</script>
</body>
</html>
